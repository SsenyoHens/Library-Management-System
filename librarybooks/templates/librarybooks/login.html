{% extends "librarybooks/base.html" %}
{% block title %}Login - Library Management System{% endblock %}
{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="w-full max-w-xs">
        <form method="POST" class="bg-white p-8 rounded-lg shadow-md space-y-6">
            {% csrf_token %}
            <div class="flex items-center justify-center mb-4">
                <i class="fas fa-lock text-blue-600 text-4xl"></i>
                <h2 class="text-2xl font-bold text-blue-800 ml-3">Library Login</h2>
            </div>

            {% if error %}
            <p class="text-sm text-red-600">{{ error }}</p>
            {% endif %}

            <div class="space-y-4">
                <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                <input id="email" name="email" type="email" required
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
            </div>

            <div class="space-y-4">
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input id="password" name="password" type="password" required
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
            </div>

            <div>
                <button type="submit"
                        class="w-flex w-full justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    Login
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
{% block extra_scripts %}{% endblock %}
